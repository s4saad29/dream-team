[pytest]
base_url = https://team.addo.ai
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
markers =
    smoke: Quick sanity checks
    login: Login and authentication flows
    dashboard: Dashboard and authenticated area tests
    profile: User profile section tests
    regression: Full regression suite
